// A representative named.conf for the test-suite.
options {
    directory "/var/named";
    listen-on port 53 { 127.0.0.1; };
    allow-query { localhost; };
    recursion no;
    dnssec-validation auto;
    /* multi-line
       comment { not a brace } ; */
    forwarders { 8.8.8.8; 1.1.1.1; };
};

acl "trusted" {
    localhost;
    192.0.2.0/24;
};

key "transfer-key" {
    algorithm hmac-sha256;
    secret "c2VjcmV0";
};

zone "example.com" IN {
    type primary;
    file "example.com.zone";
    allow-transfer { key "transfer-key"; };
};

zone "0.0.127.in-addr.arpa" {
    type primary;
    file "named.localhost"; # inline comment ; with semicolon
};

view "internal" {
    match-clients { "trusted"; };
    recursion yes;

    zone "internal.example" {
        type primary;
        file "internal/internal.example.zone";
    };
};

logging {
    channel default_log {
        file "named.log" versions 3 size 20m;
        severity info;
        print-time yes;
    };
    category default { default_log; };
};
